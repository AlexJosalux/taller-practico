<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4" style="max-width: 500px;">
    <h1 class="h3 mb-3">Mascota</h1>

    <form th:action="@{/mascotas/guardar}" th:object="${pet}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Edad</label>
            <input type="number" th:field="*{edad}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Raza</label>
            <input type="text" th:field="*{raza}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Especie</label>
            <select th:field="*{especie.id}" class="form-select" required>
                <option value="">-- Seleccione --</option>
                <option th:each="e : ${especies}" th:value="${e.id}" th:text="${e.nombre}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/mascotas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <form th:action="@{/logout}" method="post" class="text-end mb-2">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Mascotas</h1>
        <a th:href="@{/mascotas/nuevo}" class="btn btn-primary">Nueva mascota</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Raza</th>
                <th>Especie</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mascotas}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.edad}"></td>
                <td th:text="${m.raza}"></td>
                <td th:text="${m.especie.nombre}"></td>
                <td>
                    <a th:href="@{/mascotas/editar/{id}(id=${m.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/mascotas/eliminar/{id}(id=${m.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
